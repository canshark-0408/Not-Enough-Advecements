plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
}

tasks.register('checkFabricConfigurations') {
    doLast {
        println "modImplementation exists: " +
            configurations.findByName('modImplementation') != null
        println "minecraft exists: " +
            configurations.findByName('minecraft') != null
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}